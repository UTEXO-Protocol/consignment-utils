name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# The Go binding links rgbconsignment/lib/<GOOS>_<GOARCH>/librgb_consignment.a,
# and those archives are committed so that `go get` works without a Rust
# toolchain. `libs` rebuilds all four whenever the Rust side changes and
# `commit-libs` pushes them back to the branch; `test` runs against whatever
# archive is committed, so `libs` tests (native) or links (cross) each archive
# before uploading it.
#
# The RGB crates are pinned to private rgb-tools-devs repos (Cargo.toml
# [patch.crates-io]); jobs running cargo map them to our mirrors first.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      # Fetch with the git CLI, which reads the insteadOf mapping below.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      # Before rust-cache too: it runs cargo metadata, which fetches the git deps.
      - name: Map the private RGB deps to our mirrors
        env:
          TOKEN: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
        run: |
          for r in rgb-consensus rgb-ops rgb-api rgb-schemas; do
            git config --global url."https://x-access-token:${TOKEN}@github.com/UTEXO-Protocol/${r}-s-bfa.git".insteadOf "ssh://git@github.com/rgb-tools-devs/${r}.git"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cargo fmt --check
      - run: cargo test
      - run: go vet ./rgbconsignment && go test ./rgbconsignment

  libs:
    # Only the Rust side changes the archive; skip on Go/doc-only pushes.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # cross: the Go env that links the second, cross-built target.
          - os: ubuntu-24.04
            targets: "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
            cross: "GOARCH=arm64 CC=aarch64-linux-gnu-gcc"
          - os: macos-15
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
            cross: "GOARCH=amd64"
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    # Both legs see the same commit, so either one's answer is the job's.
    outputs:
      built: ${{ steps.rust.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: tj-actions/changed-files@v45
        id: rust
        with:
          files: |
            src/**
            Cargo.toml
            Cargo.lock
            scripts/build-lib.sh
            .github/workflows/ci.yml
      - if: steps.rust.outputs.any_changed == 'true'
        name: Map the private RGB deps to our mirrors
        env:
          TOKEN: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
        run: |
          for r in rgb-consensus rgb-ops rgb-api rgb-schemas; do
            git config --global url."https://x-access-token:${TOKEN}@github.com/UTEXO-Protocol/${r}-s-bfa.git".insteadOf "ssh://git@github.com/rgb-tools-devs/${r}.git"
          done
      - if: steps.rust.outputs.any_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: steps.rust.outputs.any_changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: lib-${{ matrix.os }}
      - if: steps.rust.outputs.any_changed == 'true' && runner.os == 'Linux'
        name: Cross toolchain for aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - if: steps.rust.outputs.any_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Upload only what this runner built: the checkout also holds the other
      # platform's committed archives, and merge-multiple would write both copies.
      - if: steps.rust.outputs.any_changed == 'true'
        name: Remove the committed archives
        run: rm -f rgbconsignment/lib/*/librgb_consignment.a
      - if: steps.rust.outputs.any_changed == 'true'
        name: Build archives
        run: |
          for t in ${{ matrix.targets }}; do ./scripts/build-lib.sh "$t"; done
      # The cross-built archive cannot run here, so it is only linked.
      - if: steps.rust.outputs.any_changed == 'true'
        name: Test the native archive, link the cross-built one
        run: |
          go test ./rgbconsignment
          env CGO_ENABLED=1 ${{ matrix.cross }} go test -c -o /dev/null ./rgbconsignment
      - if: steps.rust.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}
          path: rgbconsignment/lib/*/librgb_consignment.a
          if-no-files-found: error

  commit-libs:
    needs: libs
    # Without a rebuild there is nothing to commit; running anyway would delete the archives.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && needs.libs.outputs.built == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Start from no file so a missing artifact cannot leave a stale archive behind.
      - name: Remove the committed archives
        run: rm -f rgbconsignment/lib/*/librgb_consignment.a
      - uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          path: rgbconsignment/lib
          merge-multiple: true
      # Names all four archives, so a missing artifact fails here instead of
      # reaching the commit as a deleted archive.
      - name: Check all four archives arrived intact
        run: |
          python3 - rgbconsignment/lib/{darwin,linux}_{amd64,arm64}/librgb_consignment.a <<'PY'
          import os
          import sys

          for path in sys.argv[1:]:
              assert os.path.exists(path), f"{path}: missing, its libs artifact did not arrive"
              data = open(path, "rb").read()
              assert data[:8] == b"!<arch>\n", f"{path}: not an ar archive"
              off, size = 8, 0
              while off < len(data):
                  assert off + 60 <= len(data) and data[off + 58:off + 60] == b"`\n", f"{path}: bad member header at {off}"
                  size = int(data[off + 48:off + 58].strip() or 0)
                  off += 60 + size + size % 2
              # Only an odd-sized last member may drop its padding byte.
              assert off == len(data) or (size % 2 and off == len(data) + 1), \
                  f"{path}: archive ends at {len(data)}, its members at {off}"
              print(path, "ok")
          PY
      - name: Commit rebuilt archives
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild static archives [skip ci]"
          file_pattern: rgbconsignment/lib/*/librgb_consignment.a
