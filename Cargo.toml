[package]
edition = "2024"
name = "rgb-consignment"
version = "0.1.0"
description = "RGB consignment utils"
license = "Apache-2.0"


[workspace.dependencies]
amplify = { version = "4.8.1", default-features = false }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.21"
rgb-ops = { version = "0.11.1-rc.10", default-features = false, features = [
    "serde",
] }
rgb-strict-types = "1.0.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
thiserror = "2.0"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger", "dep:log", "dep:serde_json"]

[dependencies]
amplify.workspace = true
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rgb-ops.workspace = true
rgb-strict-types.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "rgb-consignment"
required-features = ["cli"]
