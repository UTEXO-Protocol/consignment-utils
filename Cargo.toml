[package]
edition = "2024"
name = "rgb-consignment"
version = "0.1.0"
description = "RGB consignment utils"
license = "Apache-2.0"


[workspace.dependencies]
amplify = { version = "=4.8.1", default-features = false }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.21"
# Exact pins plus [patch.crates-io] keep the RGB crates rgb-lib 1ae1c160
# decodes with, so a newer prerelease cannot change the strict encoding under us.
rgb-ops = { version = "=0.11.2-rc.1", default-features = false, features = [
    "serde",
] }
rgb-schemas = { version = "=0.11.2-rc.1", default-features = false }
rgb-strict-types = "=1.0.5"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
thiserror = "2.0"

[lib]
name = "rgb_consignment"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger", "dep:log"]

[dependencies]
amplify.workspace = true
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rgb-ops.workspace = true
rgb-strict-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Builds the test fixtures with the schemas rgb-lib issues and transfers under.
rgb-schemas.workspace = true

[[bin]]
name = "rgb-consignment"
required-features = ["cli"]

[profile.release]
strip = "debuginfo"

# Profile for the static archive shipped with the Go binding
# (scripts/build-lib.sh). LTO only takes effect when the staticlib is the sole
# crate type, hence `cargo rustc --crate-type staticlib` there; it internalises
# everything except the C ABI and drops the rest (56 MB -> ~11 MB). Thin LTO
# builds in ~1.5 min; fat saves another 2 MB but takes ~15 min.
# `panic = "unwind"` (the default) must stay: the C ABI turns panics into
# error strings via catch_unwind instead of aborting the host process.
[profile.lib]
inherits = "release"
lto = "thin"

# The revs of rgb-lib 1ae1c160's root [patch.crates-io]. The rgb-tools-devs
# repos are private: CI maps them to our mirrors (.github/workflows/ci.yml).
[patch.crates-io]
rgb-consensus = { git = "ssh://git@github.com/rgb-tools-devs/rgb-consensus.git", rev = "af0b751d" }
rgb-ops = { git = "ssh://git@github.com/rgb-tools-devs/rgb-ops.git", rev = "ed1d60d" }
rgb-schemas = { git = "ssh://git@github.com/rgb-tools-devs/rgb-schemas.git", rev = "641a06f" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }
